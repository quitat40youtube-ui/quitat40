const grid = document.getElementById('grid');
const status = document.getElementById('status');
ITEMS.forEach((it,i)=>{
  const c=document.createElement('div');
  c.className='card'+(i===0?' char':'');
  c.innerHTML=`<div class="ts">${it.label}<span class="rng">${it.range}</span></div>
    <img loading="lazy" src="${it.url}" alt="${it.label}">
    <div class="desc">${it.desc}</div>
    <div class="foot"><span class="m">${it.model}</span>
    <button class="dlbtn" data-i="${i}">⬇ ${it.name}</button></div>`;
  grid.appendChild(c);
});
async function saveOne(it){
  try{
    const r=await fetch(it.url,{mode:'cors'});
    if(!r.ok) throw new Error(r.status);
    const b=await r.blob();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download=it.name; document.body.appendChild(a); a.click();
    a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    return true;
  }catch(e){ window.open(it.url,'_blank'); return false; }
}
grid.addEventListener('click',e=>{
  const b=e.target.closest('.dlbtn'); if(!b) return;
  saveOne(ITEMS[+b.dataset.i]);
});
document.getElementById('all').addEventListener('click',async ev=>{
  const btn=ev.target; btn.disabled=true; let ok=0,fb=0;
  for(let i=0;i<ITEMS.length;i++){
    status.textContent=`Saving ${i+1} / ${ITEMS.length} — ${ITEMS[i].name}`;
    (await saveOne(ITEMS[i]))?ok++:fb++;
    await new Promise(r=>setTimeout(r,350));
  }
  status.textContent=`Done. ${ok} saved`+(fb?`, ${fb} opened in tabs (CORS blocked direct save — right-click → Save As).`:'.');
  btn.disabled=false;
});
</script>
