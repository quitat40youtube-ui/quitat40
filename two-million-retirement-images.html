<style>

  *{box-sizing:border-box;}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);}

  #status{font-size:13px;color:#9aa3b2;}

  .card img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#fff;}
  .meta{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .ts{font-weight:700;font-size:15px;}
  .meta button{font-size:12px;padding:6px 10px;border-radius:6px;}

const stopBtn=document.getElementById('stop');

function fileName(ts){return ts+".jpg";}

IMAGES.forEach(([ts,file])=>{
  const url=BASE+file;
  const card=document.createElement('div');
  card.className='card';
  const img=document.createElement('img');
  img.loading='lazy'; img.src=url; img.alt=ts;
  const meta=document.createElement('div'); meta.className='meta';
  const span=document.createElement('span'); span.className='ts'; span.textContent=ts;
  const btn=document.createElement('button'); btn.textContent='Download JPG';
  btn.onclick=()=>downloadOne(ts,url);
  meta.appendChild(span); meta.appendChild(btn);
  card.appendChild(img); card.appendChild(meta);
  grid.appendChild(card);
});

// Fetch the PNG, paint it onto a white canvas, export as JPEG, then save.
async function toJpegBlob(url){
  const res=await fetch(url,{mode:'cors'});
  if(!res.ok) throw new Error(res.status);
  const pngBlob=await res.blob();
  const bmp=await createImageBitmap(pngBlob);
  const canvas=document.createElement('canvas');
  canvas.width=bmp.width; canvas.height=bmp.height;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff';                 // JPG has no transparency -> white bg
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(bmp,0,0);
  bmp.close&&bmp.close();
  return await new Promise(r=>canvas.toBlob(r,'image/jpeg',JPEG_QUALITY));
}

function saveBlob(blob,name){
  const a=document.createElement('a');
  const obj=URL.createObjectURL(blob);
  a.href=obj; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(obj),4000);
}

async function downloadOne(ts,url){
  try{
    const jpg=await toJpegBlob(url);
    saveBlob(jpg,fileName(ts));
    return true;
  }catch(e){
    window.open(url,'_blank'); // fallback if CORS blocks the canvas
    return false;
  }
}

dlAllBtn.addEventListener('click',async()=>{
  stopFlag=false; dlAllBtn.disabled=true; stopBtn.disabled=false;
  let ok=0,fail=0;
  for(let i=0;i<IMAGES.length;i++){
    if(stopFlag){statusEl.textContent=`Stopped at ${i}/${IMAGES.length}.`;break;}
    const [ts,file]=IMAGES[i];
    statusEl.textContent=`Converting & downloading ${i+1}/${IMAGES.length} — ${ts}.jpg …`;
    const good=await downloadOne(ts,BASE+file);
    good?ok++:fail++;
    await new Promise(r=>setTimeout(r,400)); // throttle
  }
  if(!stopFlag) statusEl.textContent=`Done. Saved ${ok} JPG, fallback-opened ${fail}.`;
  dlAllBtn.disabled=false; stopBtn.disabled=true;
});
stopBtn.addEventListener('click',()=>{stopFlag=true;});
