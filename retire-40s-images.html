17_135447_393af540-af4d-44e9-8e37-80a3e1566ce5.png"}, {"ts": "8:26", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EJ7eXPRDK8j3ZmKXW0B5KfoJTg/hf_20260617_135449_1c0a95ff-d679-4060-b8f6-52770c12122b.png"}, {"ts": "8:28", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EJ7eXPRDK8j3ZmKXW0B5KfoJTg/hf_20260617_135452_cc3cb3e5-7fc5-4a77-9d2d-9c110fa9b350.png"}, {"ts": "8:31", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EJ7eXPRDK8j3ZmKXW0B5KfoJTg/hf_20260617_135455_5fb4707e-ea2c-4962-bfd7-f3a7c36e1494.png"}, {"ts": "8:34", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EJ7eXPRDK8j3ZmKXW0B5KfoJTg/hf_20260617_135458_c84508bc-717f-4524-88f2-324af4198d6d.png"}, {"ts": "8:42", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EJ7eXPRDK8j3ZmKXW0B5KfoJTg/hf_20260617_135500_9c780331-7baf-495e-b037-4f4163aec231.png"}, {"ts": "8:48", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EJ7eXPRDK8j3ZmKXW0B5KfoJTg/hf_20260617_135501_88583200-ac4a-4d22-8567-1d1a9fe19bba.png"}];const statusEl=document.getElementById('status');const grid=document.getElementById('grid');
function fname(ts){return ts.replace(/:/g,'_')+'.jpg';}
async function toJpegBlob(url){const resp=await fetch(url,{mode:'cors'});const blob=await resp.blob();
const bmp=await createImageBitmap(blob);const cv=document.createElement('canvas');cv.width=bmp.width;cv.height=bmp.height;
const ctx=cv.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(bmp,0,0);
return await new Promise(r=>cv.toBlob(r,'image/jpeg',0.92));}
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
IMAGES.forEach((it,i)=>{const c=document.createElement('div');c.className='card';
c.innerHTML=`<img loading="lazy" src="${it.url}"><div class="meta"><span class="ts">${it.ts}</span>
<button class="dl alt" data-i="${i}">JPG</button></div><div class="meta"><span class="pill">#${i+1}</span><span class="pill">${fname(it.ts)}</span></div>`;
grid.appendChild(c);});
grid.addEventListener('click',async e=>{const b=e.target.closest('button[data-i]');if(!b)return;
const it=IMAGES[+b.dataset.i];b.disabled=true;b.textContent='...';
try{saveBlob(await toJpegBlob(it.url),fname(it.ts));b.textContent='✓';}catch(err){window.open(it.url,'_blank');b.textContent='open';}
setTimeout(()=>{b.disabled=false;if(b.textContent!=='open')b.textContent='JPG';},1500);});
document.getElementById('all').addEventListener('click',async()=>{const btn=document.getElementById('all');btn.disabled=true;
for(let i=0;i<IMAGES.length;i++){statusEl.textContent=`Downloading ${i+1}/${IMAGES.length} — ${IMAGES[i].ts}`;
try{saveBlob(await toJpegBlob(IMAGES[i].url),fname(IMAGES[i].ts));}catch(err){window.open(IMAGES[i].url,'_blank');}
await new Promise(r=>setTimeout(r,400));}statusEl.textContent='Done — all '+IMAGES.length+' JPGs.';btn.disabled=false;});
document.getElementById('allzip').addEventListener('click',async()=>{const btn=document.getElementById('allzip');btn.disabled=true;
const zip=new JSZip();for(let i=0;i<IMAGES.length;i++){statusEl.textContent=`Adding ${i+1}/${IMAGES.length} — ${IMAGES[i].ts}`;
try{zip.file(fname(IMAGES[i].ts),await toJpegBlob(IMAGES[i].url));}catch(err){statusEl.textContent='Skip (CORS) '+IMAGES[i].ts;}}
statusEl.textContent='Zipping…';const blob=await zip.generateAsync({type:'blob'},m=>{statusEl.textContent='Zipping '+Math.round(m.percent)+'%';});
saveBlob(blob,'retire_40s_images_jpg.zip');statusEl.textContent='Done — ZIP downloaded ('+IMAGES.length+' JPGs).';btn.disabled=false;});
</script></body></html>
