async function toJpg(u){const r=await fetch(u,{mode:"cors"});const b=await r.blob();const bmp=await createImageBitmap(b);const c=document.createElement("canvas");c.width=bmp.width;c.height=bmp.height;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0);const blob=await new Promise(res=>c.toBlob(res,"image/jpeg",0.9));return new Uint8Array(await blob.arrayBuffer());}

// ---- CRC32 ----
const CRCT=(()=>{let t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xff]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
// ---- minimal ZIP (store) ----
function u16(n){return [n&255,(n>>8)&255];}
function u32(n){return [n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];}
function makeZip(files){ // files: [{name, data(Uint8Array)}]
  let parts=[],central=[],offset=0;const enc=new TextEncoder();
  for(const f of files){const nb=enc.encode(f.name);const crc=crc32(f.data);const sz=f.data.length;
    let lh=[0x50,0x4b,0x03,0x04,...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(sz),...u32(sz),...u16(nb.length),...u16(0)];
    parts.push(new Uint8Array(lh));parts.push(nb);parts.push(f.data);
    let ch=[0x50,0x4b,0x01,0x02,...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(sz),...u32(sz),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset)];
    central.push(new Uint8Array(ch));central.push(nb);
    offset+=lh.length+nb.length+sz;}
  let cdSize=central.reduce((a,p)=>a+p.length,0);let cdOff=offset;
  let eocd=[0x50,0x4b,0x05,0x06,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(cdOff),...u16(0)];
  let all=[...parts,...central,new Uint8Array(eocd)];
  return new Blob(all,{type:"application/zip"});
}
