document.getElementById("zip").onclick=async()=>{const b=document.getElementById("zip"),s=document.getElementById("s");b.disabled=true;const zip=new JSZip();let ok=0,f=0;for(let i=0;i<I.length;i++){s.textContent="Zipping "+(i+1)+"/"+I.length;try{const r=await fetch(I[i].u);zip.file(I[i].fpng,await r.blob());ok++;}catch(e){f++;}}s.textContent="Building zip...";const blob=await zip.generateAsync({type:"blob"});dl(blob,"video5_images_png.zip");s.textContent="Done "+ok+", failed "+f;b.disabled=false;};
</script></body></html>
