<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video 5 new intro (0-18s)</title>
<style>body{font-family:system-ui,Arial,sans-serif;margin:0;background:#fafafa}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:16px}button{font-size:16px;padding:12px 18px;border:0;border-radius:8px;background:#059669;color:#fff;cursor:pointer;margin-right:8px}button:disabled{opacity:.5}#s{font-size:13px;color:#059669;margin-left:6px}.hint{font-size:12px;color:#666;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;padding:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden}.card img{width:100%;height:150px;object-fit:contain;background:#fff;border-bottom:1px solid #eee}.ts{font-weight:700;padding:8px 10px}</style></head>
<body><header><h1 style="font-size:18px;margin:0 0 6px">Video 5 &mdash; new HD intro (0:00&ndash;0:18, 7 frames)</h1>
<button id="zip">&#128230; Download intro ZIP (7 JPG)</button><span id="s"></span>
<div class="hint">Download this and upload it back to me &mdash; I'll splice it into the first 18s and re-render the full video. Files named by timestamp (0-00.jpg &hellip; 0-15.jpg).</div></header><div class="grid" id="g"></div>
<script>
const I=[{"t": "0:00", "f": "0-00.jpg", "u": "https://d8j0ntlcm91z4.cloudfront.net/user_3EJ7eXPRDK8j3ZmKXW0B5KfoJTg/hf_20260703_025715_d5ab0b20-2aea-430a-854a-05ebb8b670c6.png"}, {"t": "0:03", "f": "0-03.jpg", "u": "https://d8j0ntlcm91z4.cloudfront.net/user_3EJ7eXPRDK8j3ZmKXW0B5KfoJTg/hf_20260703_025718_420d5ead-36cf-4a1a-912d-24ea3127060b.png"}, {"t": "0:05", "f": "0-05.jpg", "u": "https://d8j0ntlcm91z4.cloudfront.net/user_3EJ7eXPRDK8j3ZmKXW0B5KfoJTg/hf_20260703_025720_471ab876-ed89-47ba-92dd-2d6b04e40de5.png"}, {"t": "0:08", "f": "0-08.jpg", "u": "https://d8j0ntlcm91z4.cloudfront.net/user_3EJ7eXPRDK8j3ZmKXW0B5KfoJTg/hf_20260703_025722_165bfd98-5a88-4df2-ae9e-d51ae73c38c0.png"}, {"t": "0:10", "f": "0-10.jpg", "u": "https://d8j0ntlcm91z4.cloudfront.net/user_3EJ7eXPRDK8j3ZmKXW0B5KfoJTg/hf_20260703_025734_5220ee13-496b-4e71-a61a-dd427df08952.png"}, {"t": "0:12", "f": "0-12.jpg", "u": "https://d8j0ntlcm91z4.cloudfront.net/user_3EJ7eXPRDK8j3ZmKXW0B5KfoJTg/hf_20260703_025737_36f0b673-7fca-4416-8d36-ec78c5d1763a.png"}, {"t": "0:15", "f": "0-15.jpg", "u": "https://d8j0ntlcm91z4.cloudfront.net/user_3EJ7eXPRDK8j3ZmKXW0B5KfoJTg/hf_20260703_025740_bf9efa05-47bd-4b20-9e47-0fdda36e8560.png"}];const g=document.getElementById("g");
async function toJpg(u){const r=await fetch(u,{mode:"cors"});const b=await r.blob();const bmp=await createImageBitmap(b);const c=document.createElement("canvas");c.width=bmp.width;c.height=bmp.height;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0);const bl=await new Promise(z=>c.toBlob(z,"image/jpeg",0.92));return new Uint8Array(await bl.arrayBuffer());}
function dl(bl,n){const u=URL.createObjectURL(bl);const a=document.createElement("a");a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000);}
const CRCT=(()=>{let t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xff]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function u16(n){return[n&255,(n>>8)&255];}function u32(n){return[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];}
function makeZip(files){let parts=[],cen=[],off=0;const e=new TextEncoder();for(const f of files){const nb=e.encode(f.name),crc=crc32(f.data),sz=f.data.length;let lh=[0x50,0x4b,3,4,...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(sz),...u32(sz),...u16(nb.length),...u16(0)];parts.push(new Uint8Array(lh),nb,f.data);let ch=[0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(sz),...u32(sz),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)];cen.push(new Uint8Array(ch),nb);off+=lh.length+nb.length+sz;}let cs=cen.reduce((a,p)=>a+p.length,0);let eo=[0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)];return new Blob([...parts,...cen,new Uint8Array(eo)],{type:"application/zip"});}
for(const it of I){const c=document.createElement("div");c.className="card";c.innerHTML='<img loading="lazy" src="'+it.u+'"><div class="ts">'+it.t+' &middot; '+it.f+'</div>';g.appendChild(c);}
document.getElementById("zip").onclick=async()=>{const b=document.getElementById("zip"),s=document.getElementById("s");b.disabled=true;let files=[],f=0;for(let i=0;i<I.length;i++){s.textContent="Fetching "+(i+1)+"/"+I.length;try{files.push({name:I[i].f,data:await toJpg(I[i].u)});}catch(e){f++;}}s.textContent="Zipping...";dl(makeZip(files),"video5-intro.zip");s.textContent="Done: "+files.length+" frames"+(f?(", "+f+" failed"):"");b.disabled=false;};
</script></body></html>
